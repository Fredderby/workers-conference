version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workers-conf-app-v2
    restart: unless-stopped
    ports:
      - "3056:3056"
    environment:
      # Connects to the existing Dokploy-managed PostgreSQL 18.6
      # (users/data lives there), reached over the shared internal network.
      - DATABASE_URL=postgresql://app_user:c49t4QO5rTCAQ69AUfnI@workers-data-jdojwz:5432/app_data
      - JWT_SECRET=${JWT_SECRET:-workers-conf-2026-super-secret-key-change-in-prod}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-workers-conf-2026-refresh-secret-change-in-prod}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3056}
      - NODE_ENV=production
    networks:
      - workers-data-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3056/login', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  # workers-data-net exists on the host (created by Dokploy, not compose).
  # The managed Postgres (workers-data-jdojwz) is attached here, so the app
  # reaches it at workers-data-jdojwz:5432 without publishing any host port.
  workers-data-net:
    external: true
