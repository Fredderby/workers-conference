version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workers-conf-app-v2
    restart: unless-stopped
    ports:
      - "3056:3056"
    environment:
      - DATABASE_URL=postgresql://app_user:c49t4QO5rTCAQ69AUfnI@workers-data-jdojwz:5432/app_data
      - JWT_SECRET=${JWT_SECRET:-workers-conf-2026-super-secret-key-change-in-prod}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-workers-conf-2026-refresh-secret-change-in-prod}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3056}
      - NODE_ENV=production
    networks:
      - workers-data-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3056/login', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  database:
    image: postgres:16
    container_name: workers-data-jdojwz
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: c49t4QO5rTCAQ69AUfnI
      POSTGRES_DB: app_data
    ports:
      - "5432:5432"
    networks:
      workers-data-net:
        aliases:
          - workers-data-jdojwz

networks:
  workers-data-net:
    external: true
