version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workers-conf-app
    restart: unless-stopped
    ports:
      - "3037:3037"
    environment:
      # Connect to the Dokploy-managed Postgres service by its Docker service
      # name "workers-db-p9wou6" on the standard internal port 5432.
      # Do NOT use 15432/15433 here — those are host ports for the SSH tunnel.
      - DATABASE_URL=postgresql://wc_user:xzTUuV0XqlOVPNKnAxd2@workers-db-p9wou6:5432/wc_app
      - JWT_SECRET=workers-conf-2026-super-secret-key-change-in-prod
      - JWT_REFRESH_SECRET=workers-conf-2026-refresh-secret-change-in-prod
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3037}
      - NODE_ENV=production
