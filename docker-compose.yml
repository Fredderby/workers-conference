version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workers-conf-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Points at the external Dokploy PostgreSQL (workers-db-p9wou6).
      # Currently unused — the app runs on the file-backed mock DB (mock.ts)
      # until PostgreSQL support is wired in. Kept here for when that lands.
      - DATABASE_URL=postgresql://wc_user:xzTUuV0XqlOVPNKnAxd2@workers-db-p9wou6:5432/wc_app
      - JWT_SECRET=workers-conf-2026-super-secret-key-change-in-prod
      - JWT_REFRESH_SECRET=workers-conf-2026-refresh-secret-change-in-prod
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=production
